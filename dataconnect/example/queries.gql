mutation InsertUser {
  user_insert(data: {
    id_expr: "auth.uid",
    username: "newuser",
    email: "user@example.com",
    createdAt_expr: "request.time"
  })
}

mutation UpdateUser($bio: String) @auth(level: USER) {
  user_update(key: {id_expr: "auth.uid"}, data: {bio: $bio})
}

mutation DeleteUser @auth(level: USER) {
  user_delete(key: {id_expr: "auth.uid"})
}

query GetCurrentUser @auth(level: USER) {
  user(key: {id_expr: "auth.uid"}) {
    username
    email
  }
}

query ListUsers @auth(level: PUBLIC, insecureReason: "Public profiles are allowed for social discovery.") {
  users {
    username
  }
}

mutation InsertPost($content: String!) @auth(level: USER) {
  post_insert(data: {
    content: $content,
    authorId_expr: "auth.uid",
    createdAt_expr: "request.time"
  })
}

mutation UpdatePost($id: UUID!, $content: String!) @auth(level: USER) {
  post_update(key: {id: $id}, data: {content: $content})
}

mutation DeletePost($id: UUID!) @auth(level: USER) {
  post_delete(key: {id: $id})
}

query GetPost($id: UUID!) @auth(level: PUBLIC, insecureReason: "Posts are intended to be shared publicly.") {
  post(id: $id) {
    content
    author { username }
  }
}

query ListPosts @auth(level: PUBLIC, insecureReason: "List of posts is public content.") {
  posts(orderBy: [{createdAt: DESC}]) {
    content
    author { username }
  }
}

mutation FollowUser($followedId: UUID!) @auth(level: USER) {
  follow_insert(data: {
    followerId_expr: "auth.uid",
    followedId: $followedId,
    createdAt_expr: "request.time"
  })
}

mutation UnfollowUser($followedId: UUID!) @auth(level: USER) {
  follow_delete(key: {
    followerId_expr: "auth.uid",
    followedId: $followedId
  })
}

query ListFollowing @auth(level: USER) {
  follows(where: {followerId: {eq_expr: "auth.uid"}}) {
    followed { username }
  }
}

mutation LikePost($postId: UUID!) @auth(level: USER) {
  like_insert(data: {
    userId_expr: "auth.uid",
    postId: $postId,
    createdAt_expr: "request.time"
  })
}

mutation UnlikePost($postId: UUID!) @auth(level: USER) {
  like_delete(key: {
    userId_expr: "auth.uid",
    postId: $postId
  })
}

query ListLikes @auth(level: USER) {
  likes(where: {userId: {eq_expr: "auth.uid"}}) {
    post { content }
  }
}

mutation AddComment($postId: UUID!, $text: String!) @auth(level: USER) {
  comment_insert(data: {
    text: $text,
    authorId_expr: "auth.uid",
    postId: $postId,
    createdAt_expr: "request.time"
  })
}

mutation DeleteComment($id: UUID!) @auth(level: USER) {
  comment_delete(id: $id)
}

query GetComments($postId: UUID!) @auth(level: PUBLIC, insecureReason: "Comments on public posts are public.") {
  comments(where: {postId: {eq: $postId}}) {
    text
    author { username }
  }
}